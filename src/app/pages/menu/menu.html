<div class="menu">
  <h1>Karpers</h1>

  <div class="product-card" *ngFor="let product of products()">
    <h3>{{ product.name }}</h3>
    <p>${{ product.price }}</p>

    <ul *ngIf="product.variants.length > 0">
      <li *ngFor="let variant of product.variants">{{ variant }}</li>
    </ul>

    <button (click)="addToCart(product)">Agregar</button>
  </div>

  <div class="cart-bar" *ngIf="cart().length > 0">
    <p>{{ cart().length }} producto(s) — Total: ${{ cartTotal() }}</p>
    <button (click)="submitOrder()">Enviar pedido</button>
  </div>
</div>
