<div class="menu">
  <h1>Karpers</h1>
  <p *ngIf="tableNumber() > 0">Mesa {{ tableNumber() }}</p>

  <div class="product-card" *ngFor="let product of products()">
    <h3>{{ product.name }}</h3>
    <p>${{ product.price }}</p>

    <select *ngIf="product.variants.length > 0" (change)="selectVariant(product.id, $any($event.target).value)">
      <option value="" disabled selected>Elige un sabor</option>
      <option *ngFor="let variant of product.variants" [value]="variant">{{ variant }}</option>
    </select>

    <input
      type="text"
      placeholder="Notas (opcional)"
      (input)="updateNotes(product.id, $any($event.target).value)"
    />
    <button (click)="addToCart(product)">Agregar</button>
  </div>

  <div class="cart-bar" *ngIf="cart().length > 0">
    <p>{{ cart().length }} producto(s) — Total: ${{ cartTotal() }}</p>
    <button (click)="submitOrder()">Enviar pedido</button>
  </div>
</div>
