<div class="dispatch">
  <div class="new-order-banner" *ngIf="newOrderAlert()">
    🔔 ¡Pedido nuevo!
  </div>

  <header class="dispatch-header">
    <h1>🔥 Despacho</h1>
    <button class="logout-btn" (click)="logout()">Cerrar sesión</button>
  </header>

  <div class="ticket" *ngFor="let order of orders()" [class]="'status-' + order.status">
    <div class="ticket-top">
      <span class="table-number">MESA {{ order.tableNumber }}</span>
      <span class="status-pill">{{ statusLabels[order.status] }}</span>
    </div>

    <div class="tear-line"></div>

    <ul>
      <li *ngFor="let item of order.items">
        <span class="qty">{{ item.quantity }}×</span>
        <span class="item-name">{{ item.product?.name }}</span>
        <span *ngIf="item.selectedVariant" class="variant">{{ item.selectedVariant }}</span>
        <span *ngIf="item.notes" class="notes">✎ {{ item.notes }}</span>
      </li>
    </ul>

    <button *ngIf="order.status < 3" class="advance-btn" (click)="advanceStatus(order)">
      Avanzar a {{ statusLabels[order.status + 1] }} →
    </button>
  </div>
</div>
